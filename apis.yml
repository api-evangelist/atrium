name: Atrium
description: >-
  Atrium is a sales-effectiveness and sales-performance business intelligence
  platform for revenue teams. It continuously monitors sales KPIs to surface
  anomalies in rep and team performance, detects which behaviors and activities
  are driving (or dragging) output, and delivers AI-powered coaching
  recommendations to managers and reps. The product connects directly to
  Salesforce, HubSpot, data warehouses, and communication tools rather than
  exposing a public developer API. Founded in San Francisco by Jason Heidema
  (CEO) and Peter Kazanjy and backed by Andreessen Horowitz (a16z), Bullpen
  Capital, and Electric Capital, Atrium was acquired by Fullcast in 2025 and is
  now offered as Fullcast Performance; atriumhq.com redirects to fullcast.com
  and only the customer application login at app.atriumhq.com remains on the
  Atrium domain.
