source: live GET of /.well-known/* on every host named in apis.yml
note: >-
  No .well-known document is served on any Atrium host. www.atriumhq.com answers every
  path — including every /.well-known/* path — with a blanket HTTP 301 to
  https://www.fullcast.com/product/fullcast-performance/ (the acquirer's product page for
  the former Atrium product), so a naive follow-redirect probe reports HTTP 200 with an
  HTML marketing page. That is a soft-200, not a document. app.atriumhq.com, the customer
  application host that still resolves, returns a genuine HTTP 404 with an empty JSON body
  on every path. NO WellKnown, SecurityTxt or APICatalog pointer is emitted from this file:
  every probe is a recorded absence.
